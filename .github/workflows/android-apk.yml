name: Build Polya Writer APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Test and assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test project
        run: npm test
      - name: Validate JavaScript
        run: npm run check
      - name: Prepare Android assets
        run: node scripts/prepare-android-assets.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: polya-writer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
